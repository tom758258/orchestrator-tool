name: Live Chart Preflight (temporary)
on:
  push:
    branches:
      - feat/live-chart-significant-change
    paths:
      - 'apps/desktop/**'
      - 'docs/**'
      - 'scripts/**'
jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Verify generated Help
        run: |
          python -m pip install -r scripts/requirements-help.txt
          python -B scripts/test_generate_help.py
          python scripts/generate_help.py --check
      - name: Full frontend tests
        working-directory: apps/desktop
        run: node --test tests/*.test.mjs
      - name: Typecheck
        working-directory: apps/desktop
        run: npm run typecheck
      - name: Build
        working-directory: apps/desktop
        run: npm run build
