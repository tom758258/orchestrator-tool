name: Pre-PR Validation

on:
  push:
    branches:
      - feature/chart-options-fit-data

permissions:
  contents: write

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Install Python for Help generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate and verify tracked Help bundle
        run: |
          python -m pip install -r scripts/requirements-help.txt
          python -B scripts/test_generate_help.py
          python scripts/generate_help.py
          python scripts/generate_help.py --check

      - name: Test modified frontend areas
        working-directory: apps/desktop
        run: node --test tests/execution-mode.test.mjs tests/simulation-run.test.mjs tests/chart-settings.test.mjs

      - name: Typecheck frontend
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Commit generated Help bundle
        run: |
          if ! git diff --quiet -- apps/desktop/public/help; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/desktop/public/help
            git commit -m "Regenerate Desktop Help [skip ci]"
            git push
          fi
