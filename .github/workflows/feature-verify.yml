name: Feature Verify

on:
  push:
    branches:
      - feature/meters-trigger-modes

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/meters-trigger-modes

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev

      - name: Format Rust
        run: |
          cargo fmt --all
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Generate Help
        run: |
          python -m pip install -r scripts/requirements-help.txt
          python -B scripts/test_generate_help.py
          python scripts/generate_help.py

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Frontend tests
        working-directory: apps/desktop
        run: node --test tests/*.test.mjs

      - name: Frontend typecheck
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Frontend build
        working-directory: apps/desktop
        run: npm run build

      - name: Rust clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --locked

      - name: Rust build
        run: cargo build --locked

      - name: Tauri clippy
        run: cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Tauri tests
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Diff check
        run: git diff --check

      - name: Commit generated and formatted files
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Format code and refresh generated Help"
            git push origin HEAD:feature/meters-trigger-modes
          fi
