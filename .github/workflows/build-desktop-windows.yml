name: Build Windows CLI and Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install stable Rust (Windows x64 MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build CLI and Tauri Desktop without installer
        shell: pwsh
        run: .\scripts\build-all.ps1

      - name: Verify Windows distribution and record short commit SHA
        id: artifact
        shell: pwsh
        run: |
          foreach ($name in @("Orchestrator Tool.exe", "orchestrator-tool.exe", "LICENSE", "THIRD_PARTY_NOTICES.txt", "licenses/DEPENDENCIES.txt")) {
            $exe = Join-Path "dist/windows-x64" $name
            if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
              throw "Expected distribution file not found: $exe"
            }
            $file = Get-Item -LiteralPath $exe
            if ($file.Length -le 0) {
              throw "Expected distribution file is empty: $exe"
            }
            $file | Select-Object FullName, Length
          }
          $shortSha = (git rev-parse --short=7 HEAD).Trim()
          "short_sha=$shortSha" >> $env:GITHUB_OUTPUT

      - name: Upload Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-tool-windows-x64-${{ steps.artifact.outputs.short_sha }}
          path: dist/windows-x64/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
