<!DOCTYPE html>
<!-- Generated file. Do not edit directly. -->
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <script>
    (() => {
      const query = new URLSearchParams(location.search).get('theme');
      const preference = ['system', 'light', 'dark'].includes(query) ? query : 'system';
      const media = matchMedia('(prefers-color-scheme: dark)');
      const update = () => {
        document.documentElement.dataset.theme = preference === 'system'
          ? (media.matches ? 'dark' : 'light') : preference;
      };
      update();
      if (preference === 'system') media.addEventListener('change', update);
    })();
  </script>
  <link rel="stylesheet" href="help.css">
</head>
<body>
  <aside class="help-sidebar">
    <div class="help-sidebar-title">Orchestrator Help</div>
    <nav class="help-languages" aria-label="Language">
      <a href="desktop.html" hreflang="en" lang="en">English</a>
      <span aria-hidden="true"> | </span>
      <a href="desktop.zh-TW.html" hreflang="zh-TW" lang="zh-TW">繁體中文</a>
    </nav>
    <div id="toc-title">Contents</div>
    <nav id="toc" aria-labelledby="toc-title"></nav>
  </aside>
  <main class="help-content" id="help-content">
{{content}}
  </main>
  <script>
    (() => {
      if (document.documentElement.lang === 'zh-TW') {
        document.getElementById('toc-title').textContent = '章節導覽';
      }
      const theme = new URLSearchParams(location.search).get('theme');
      document.querySelectorAll('.help-languages a').forEach(link => {
        if (['system', 'light', 'dark'].includes(theme)) {
          link.setAttribute('href', link.getAttribute('href') + '?theme=' + theme);
        }
        if (link.hreflang === document.documentElement.lang) {
          link.setAttribute('aria-current', 'page');
        }
      });

      const headings = [...document.querySelectorAll('#help-content h2[id], #help-content h3[id]')];
      const toc = document.getElementById('toc');
      const links = headings.map(heading => {
        const link = document.createElement('a');
        link.href = '#' + heading.id;
        link.textContent = heading.textContent;
        if (heading.tagName === 'H3') link.className = 'level-3';
        toc.appendChild(link);
        return link;
      });
      let scheduled = false;
      function updateActiveSection() {
        scheduled = false;
        let active = 0;
        headings.forEach((heading, index) => {
          if (heading.getBoundingClientRect().top <= 48) active = index;
        });
        if (window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 2) {
          active = headings.length - 1;
        }
        links.forEach((link, index) => {
          link.classList.toggle('active', index === active);
          if (index === active) link.setAttribute('aria-current', 'location');
          else link.removeAttribute('aria-current');
        });
      }
      function scheduleUpdate() {
        if (!scheduled) {
          scheduled = true;
          requestAnimationFrame(updateActiveSection);
        }
      }
      window.addEventListener('scroll', scheduleUpdate, { passive: true });
      window.addEventListener('resize', scheduleUpdate);
      window.addEventListener('load', scheduleUpdate);
      updateActiveSection();
    })();
  </script>
</body>
</html>
