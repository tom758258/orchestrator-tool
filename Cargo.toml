[package]
name = "orchestrator-tool"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
ureq = { version = "3.4", default-features = false, features = ["json"] }

[[test]]
name = "worker"
path = "tests/worker.rs"
harness = false
