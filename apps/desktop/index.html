<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        let preference = 'system'
        try {
          const saved = localStorage.getItem('orchestrator-tool.theme')
          if (saved === 'light' || saved === 'dark') preference = saved
        } catch {}
        let dark = preference === 'dark'
        try {
          if (preference === 'system') dark = matchMedia('(prefers-color-scheme: dark)').matches
        } catch {}
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
    <title>Orchestrator Tool</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
